name: Test Poosh Action (Local)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run local Poosh tests
        run: node .github/scripts/poosh-local-tests.js
